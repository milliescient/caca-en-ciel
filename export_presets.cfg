html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>#status-progress{-webkit-appearance:none;appearance:none;width:368px;height:8px;border:0;border-radius:0;background:#2a2238}#status-progress::-webkit-progress-bar{background:#2a2238}#status-progress::-webkit-progress-value{background:linear-gradient(90deg,#ff7373,#ffb34d,#ffff66,#66ff80,#66bfff,#9973ff,#e673ff)}#status-progress::-moz-progress-bar{background:linear-gradient(90deg,#ff7373,#ffb34d,#ffff66,#66ff80,#66bfff,#9973ff,#e673ff)}</style><script>/* Pinches and scrolls zoom the game, never the page. Godot reads every wheel event as one whole notch, so trackpad streams are added up into notches first: 100 px of scrolling, or 10% of pinch, which arrives as ctrl+wheel or, in Safari, as gesture events */(()=>{let owed=0,scale=1;const notches=(e,n)=>{owed+=n;for(;Math.abs(owed)>=1;owed-=Math.sign(owed)){const w=new WheelEvent('wheel',{deltaY:Math.sign(owed)*100,clientX:e.clientX,clientY:e.clientY,bubbles:true,cancelable:true});w.counted=true;document.getElementById('canvas').dispatchEvent(w)}};window.addEventListener('wheel',e=>{if(e.counted)return;e.preventDefault();e.stopImmediatePropagation();const px=[1,33,400][e.deltaMode];notches(e,e.deltaY*px/(e.ctrlKey?10:100))},{capture:true,passive:false});document.addEventListener('gesturestart',e=>{e.preventDefault();scale=1});document.addEventListener('gesturechange',e=>{e.preventDefault();notches(e,-Math.log(e.scale/scale)/Math.log(1.1));scale=e.scale});document.addEventListener('gestureend',e=>e.preventDefault())})()</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
