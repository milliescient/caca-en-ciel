html/custom_html_shell=""
html/head_include="<style>#status-progress{-webkit-appearance:none;appearance:none;width:368px;height:8px;top:calc(50% - 4px);bottom:auto;border:0;border-radius:0;background:#2a2238}#status-progress::-webkit-progress-bar{background:#2a2238}#status-progress::-webkit-progress-value{background:linear-gradient(90deg,#ff7373,#ffb34d,#ffff66,#66ff80,#66bfff,#9973ff,#e673ff)}#status-progress::-moz-progress-bar{background:linear-gradient(90deg,#ff7373,#ffb34d,#ffff66,#66ff80,#66bfff,#9973ff,#e673ff)}</style><script>/* Pinches and scrolls zoom the game, never the page. Godot reads every wheel event as one whole notch, so trackpad streams are added up into notches first: 100 px of scrolling, or 10% of pinch, which arrives as ctrl+wheel or, in Safari, as gesture events */(()=>{let owed=0,scale=1;const notches=(e,n)=>{owed+=n;for(;Math.abs(owed)>=1;owed-=Math.sign(owed)){const w=new WheelEvent('wheel',{deltaY:Math.sign(owed)*100,clientX:e.clientX,clientY:e.clientY,bubbles:true,cancelable:true});w.counted=true;document.getElementById('canvas').dispatchEvent(w)}};window.addEventListener('wheel',e=>{if(e.counted)return;e.preventDefault();e.stopImmediatePropagation();const px=[1,33,400][e.deltaMode];notches(e,e.deltaY*px/(e.ctrlKey?10:100))},{capture:true,passive:false});document.addEventListener('gesturestart',e=>{e.preventDefault();scale=1});document.addEventListener('gesturechange',e=>{e.preventDefault();notches(e,-Math.log(e.scale/scale)/Math.log(1.1));scale=e.scale});document.addEventListener('gestureend',e=>e.preventDefault())})()</script><script>/* The favicon is one piece of poop, smoothed out as cured poop is, at random: it grows from a 3x3 square into a blob on a 9x9 grid as stuck poop spreads, and is coloured with the rainbow running round it, filling the icon. The engine sets its own icon once it starts, so this one is put back whenever that happens */(()=>{const R=[[1,.3,.3],[1,.6,.2],[1,1,.3],[.3,1,.4],[.3,.7,1],[.5,.3,1],[.8,.3,1]],N=64,S=.6;const k=(x,y)=>x+','+y,cells=new Map();for(let x=3;x<6;x++)for(let y=3;y<6;y++)cells.set(k(x,y),[x,y]);const n=14+Math.floor(Math.random()*9);while(cells.size<n){const rim=new Map();for(const[x,y]of cells.values())for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const c=[x+dx,y+dy];if(c[0]>=0&&c[0]<9&&c[1]>=0&&c[1]<9&&!cells.has(k(...c)))rim.set(k(...c),c)}let all=[],sum=0;for(const c of rim.values()){let w=0;for(let dx=-1;dx<2;dx++)for(let dy=-1;dy<2;dy++)w+=cells.has(k(c[0]+dx,c[1]+dy));sum+=w*w;all.push([c,sum])}const r=Math.random()*sum,c=all.find(a=>a[1]>r)[0];cells.set(k(...c),c)}const v=[...cells.values()],xs=v.map(c=>c[0]),ys=v.map(c=>c[1]),cx=(Math.min(...xs)+Math.max(...xs)+1)/2,cy=(Math.min(...ys)+Math.max(...ys)+1)/2,span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))+2.2;const cv=document.createElement('canvas');cv.width=cv.height=N;const g=cv.getContext('2d'),img=g.createImageData(N,N);for(let py=0;py<N;py++)for(let px=0;px<N;px++){const gx=cx+((px+.5)/N-.5)*span,gy=cy+((py+.5)/N-.5)*span;let f=0;for(const[x,y]of v)f+=Math.exp(-((gx-x-.5)**2+(gy-y-.5)**2)/(2*S*S));const a=Math.max(0,Math.min(1,(f-.5)/.12+.5)),u=(Math.atan2(gy-cy,gx-cx)/(2*Math.PI)+1)%1*7,j=Math.floor(u),t=u-j,o=4*(py*N+px);for(let i=0;i<3;i++)img.data[o+i]=Math.round(255*(R[j][i]+(R[(j+1)%7][i]-R[j][i])*t));img.data[o+3]=Math.round(255*a)}g.putImageData(img,0,0);const mine=cv.toDataURL(),set=()=>{const l=document.getElementById('-gd-engine-icon');if(l&&l.getAttribute('href')!==mine)l.setAttribute('href',mine)};new MutationObserver(set).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['href']});set()})()</script>"
